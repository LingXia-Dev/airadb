[package]
name = "airadb"
version = "0.3.0"
edition = "2021"
description = "Pure Rust ADB client for TCP connections, Android 5+, and cross-platform embedding"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LingXia-Dev/airadb"
readme = "README.md"
keywords = ["adb", "android", "client", "tcp", "pure-rust"]
categories = ["network-programming", "command-line-utilities", "development-tools"]

[features]
default = ["cli"]
cli = ["blocking", "dep:clap", "dep:dirs", "dep:tracing-subscriber", "tokio/rt-multi-thread", "tokio/io-std"]
blocking = ["tokio/rt-multi-thread"]
serde = ["dep:serde"]

[dependencies]
tokio = { version = "1.43", features = ["io-util", "net", "sync", "macros", "rt", "time", "fs"] }
rsa = { version = "0.10", features = ["pkcs1v15", "sha1"] }
num-bigint = "0.5"
num-traits = "0.2"
sha1 = "0.11"
base64 = "0.23"
byteorder = "1.5"
tracing = "0.1"
socket2 = "0.6"
getrandom = { version = "0.4", features = ["sys_rng"] }
futures-core = "0.3"
serde = { version = "1", features = ["derive"], optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
clap = { version = "4.5", features = ["derive"], optional = true }
dirs = { version = "7.0", optional = true }

[dev-dependencies]
tokio = { version = "1.43", features = ["full", "test-util"] }

[[bin]]
name = "airadb"
path = "src/bin/airadb.rs"
required-features = ["cli"]

[lib]
name = "airadb"
path = "src/lib.rs"

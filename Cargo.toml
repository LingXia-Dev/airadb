[package]
name = "airadb"
version = "0.1.0"
edition = "2021"
description = "Pure Rust ADB client for TCP connections, Android 5+, and cross-platform embedding"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LingXia-Dev/airadb"
readme = "README.md"
keywords = ["adb", "android", "client", "tcp", "pure-rust"]
categories = ["network-programming", "command-line-utilities", "development-tools"]

[dependencies]
tokio = { version = "1.43", features = ["io-util", "io-std", "net", "sync", "macros", "rt", "rt-multi-thread", "time", "fs"] }
rsa = { version = "0.10", features = ["pkcs1v15", "sha1"] }
num-bigint = "0.5"
num-traits = "0.2"
sha1 = "0.11"
base64 = "0.23"
byteorder = "1.5"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
dirs = "7.0"
socket2 = "0.6"
getrandom = { version = "0.4", features = ["sys_rng"] }

[dev-dependencies]
tokio = { version = "1.43", features = ["full", "test-util"] }

[[bin]]
name = "airadb"
path = "src/bin/airadb.rs"

[lib]
name = "airadb"
path = "src/lib.rs"
